name: CI

on:
  # Pull requests only. A push to main or staging is tested once, inside the
  # deploy workflow (workflow_call). Running this again on push doubled the gate
  # and made every branch push look like a second CI run.
  pull_request:
  workflow_call:

# Categorized test pipelines. The gate must pass before deploy.yml or
# deploy-staging.yml deploys. The broad Unit/Feature suites have known failures
# outside these categories; they live in ci-full-report.yml so a 20-minute
# timeout cannot mark a pull request or a deploy as cancelled.

jobs:
  gate:
    name: Test gate (blocks deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, curl, json, bcmath, gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Assert PSR-4 autoload is clean
        run: |
          set -o pipefail
          OUTPUT=$(composer dump-autoload --no-interaction --no-ansi 2>&1 | tee /dev/stderr)
          if echo "$OUTPUT" | grep -qi 'does not comply with psr-4'; then
            echo "::error::composer dump-autoload reported PSR-4 warnings"
            exit 1
          fi

      - name: Prepare application
        run: |
          cp .env.example .env
          # Keep the console bootstrap from blocking on Pulse/Telescope during tests.
          {
            echo "PULSE_ENABLED=false"
            echo "TELESCOPE_ENABLED=false"
          } >> .env
          php artisan key:generate

      # Tenancy is one step on purpose. tests/CreatesApplication.php forces
      # MULTI_TENANT=false for every case, and the suite turns tenancy.enabled
      # on and off inside the tests. A second "MULTI_TENANT=true" step reran
      # the same suite and added about five minutes without changing coverage.

      - name: 1 · Unit pipeline (events)
        run: php artisan test tests/Unit/Events --compact

      - name: 2 · Feature pipeline (events)
        run: php artisan test tests/Feature/Events --compact

      - name: 3 · Smoke pipeline (UI / every endpoint)
        run: php artisan test --testsuite=Smoke --compact

      - name: 4 · API pipeline
        run: php artisan test --testsuite=Api --compact

      - name: 5 · Notifications pipeline
        run: php artisan test --testsuite=Notifications --compact

      - name: 6 · Mail & external communications pipeline
        run: php artisan test --testsuite=Mail --compact

      - name: 7 · Tenant isolation
        run: php artisan test --testsuite=Tenancy --compact

      - name: 8 · Load pipeline (events)
        run: php artisan test tests/Load/Events --compact

  mysql-migrate-fresh:
    name: MySQL migrate:fresh --seed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: khedma_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, curl, json, bcmath, gd, pdo_mysql
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application (MySQL)
        run: |
          cp .env.example .env
          {
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=khedma_ci"
            echo "DB_USERNAME=root"
            echo "DB_PASSWORD=root"
            echo "PULSE_ENABLED=false"
            echo "TELESCOPE_ENABLED=false"
          } >> .env
          php artisan key:generate

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then echo "MySQL ready"; break; fi
            echo "waiting for mysql ($i)"; sleep 2
          done

      - name: migrate:fresh --seed on clean MySQL
        run: php artisan migrate:fresh --seed --force --no-interaction
