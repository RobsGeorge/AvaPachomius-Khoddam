name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

# One deploy at a time. Do not cancel an in-flight deploy: it may already
# have run `artisan down`, and cancelling it leaves the site offline.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout deploy script
        uses: actions/checkout@v4

      - name: Check SSH retry classifier
        run: bash scripts/ci/ssh-deploy.sh --self-test

      # deaconia.com. The copy of this file on main deploys khedma-staging
      # with SSH_* secrets. This branch must keep STAGING_SSH_* and the
      # deaconia script, or a merge from main will publish to the wrong VPS.
      - name: Deploy to VPS (deaconia staging)
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: bash scripts/ci/ssh-deploy.sh scripts/vps/deploy-deaconia-staging.sh
