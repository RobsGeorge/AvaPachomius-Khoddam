name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

# One deploy at a time. Do not cancel an in-flight deploy: it may already
# have run `artisan down`, and cancelling it leaves the site offline.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout deploy script
        uses: actions/checkout@v4

      - name: Check SSH retry classifier
        run: bash scripts/ci/ssh-deploy.sh --self-test

      # Same runner as production. See deploy.yml for why this is OpenSSH.
      - name: Deploy to VPS (staging)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: bash scripts/ci/ssh-deploy.sh scripts/vps/deploy-staging.sh
