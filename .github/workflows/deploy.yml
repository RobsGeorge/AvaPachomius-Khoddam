name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time. Do not cancel an in-flight deploy: it may already
# have run `artisan down`, and cancelling it leaves the site offline.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout deploy script
        uses: actions/checkout@v4

      - name: Check SSH retry classifier
        run: bash scripts/ci/ssh-deploy.sh --self-test

      # OpenSSH, not the retry action. That action parses its inputs as YAML,
      # and the multiline private key makes the parser fail before any connection
      # ("a multiline key may not be an implicit key"). appleboy/ssh-action@v1.0.3
      # also has no script_path input, so the previous wrapper never ran the
      # deploy script. Connection failures are retried; a remote script failure
      # is not.
      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: bash scripts/ci/ssh-deploy.sh scripts/vps/deploy-production.sh
