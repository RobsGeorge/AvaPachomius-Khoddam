name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Avoid overlapping deploys (second push while first runs often hits SSH limits).
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout deploy script
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: appleboy/ssh-action@v1.0.3
          attempt_limit: 4
          attempt_delay: 45000
          with: |
            host: ${{ secrets.SSH_HOST }}
            username: ${{ secrets.SSH_USER }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            port: ${{ secrets.SSH_PORT }}
            timeout: 180s
            command_timeout: 30m
            script_path: scripts/vps/deploy-production.sh
