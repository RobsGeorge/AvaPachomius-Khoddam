name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Avoid overlapping deploys (second push while first runs often hits SSH limits).
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    with:
      skip_full_suite: true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout deploy script
        uses: actions/checkout@v4

      # Do not wrap appleboy/ssh-action in wretry.action: the multiline
      # SSH_PRIVATE_KEY secret breaks that action's YAML `with:` block.
      - name: Deploy to VPS (attempt 1)
        id: ssh1
        continue-on-error: true
        uses: ./.github/actions/ssh-production-deploy
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

      - name: Wait before SSH retry 2
        if: steps.ssh1.outcome == 'failure'
        run: sleep 45

      - name: Deploy to VPS (attempt 2)
        id: ssh2
        if: steps.ssh1.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/ssh-production-deploy
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

      - name: Wait before SSH retry 3
        if: steps.ssh1.outcome == 'failure' && steps.ssh2.outcome == 'failure'
        run: sleep 45

      - name: Deploy to VPS (attempt 3)
        id: ssh3
        if: steps.ssh1.outcome == 'failure' && steps.ssh2.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/ssh-production-deploy
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

      - name: Wait before SSH retry 4
        if: >-
          steps.ssh1.outcome == 'failure' &&
          steps.ssh2.outcome == 'failure' &&
          steps.ssh3.outcome == 'failure'
        run: sleep 45

      - name: Deploy to VPS (attempt 4)
        id: ssh4
        if: >-
          steps.ssh1.outcome == 'failure' &&
          steps.ssh2.outcome == 'failure' &&
          steps.ssh3.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/ssh-production-deploy
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

      - name: Fail if SSH deploy never succeeded
        if: >-
          steps.ssh1.outcome != 'success' &&
          steps.ssh2.outcome != 'success' &&
          steps.ssh3.outcome != 'success' &&
          steps.ssh4.outcome != 'success'
        run: |
          echo "SSH deploy failed after 4 attempts"
          exit 1
